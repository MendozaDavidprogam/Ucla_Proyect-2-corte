<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carnetización Universitaria MVC - Bootstrap</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 720px;">
        <!-- SECCIÓN DE LA VISTA MAYOR -->
        <section id="body" class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h4 mb-0">Carnetización Universitaria</h2>
                    <button id="body_btNuevaSolicitud" type="button" class="btn btn-primary">
                        Nueva Solicitud
                    </button>
                </div>

                <hr />

                <div class="mb-3">
                    <div class="fw-semibold mb-1">Solicitudes procesadas:</div>
                    <div id="body_lblDetalleSolicitud" class="small text-secondary"></div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-sm-6">
                        <div class="p-3 bg-body-tertiary rounded border">
                            <div class="text-muted small">Monto Total Recaudado</div>
                            <div class="fs-5 fw-bold">$<span id="body_lblTotalRecaudado">0</span></div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-body-tertiary rounded border">
                            <div class="text-muted small">Cantidad de carnets por reposición:</div>
                            <div class="fs-5 fw-bold"><span id="body_lblCantidadReposiciones">0</span></div>
                        </div>
                    </div>
                </div>

                <hr />

                <div class="mb-3">
                    <div class="fw-semibold mb-1">Tiempos de emisión por solicitud:</div>
                    <div id="body_lblDetalleTiempoEmision" class="text-secondary"></div>
                </div>

                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="p-3 bg-body-tertiary rounded border">
                            <div class="text-muted small">Tiempo total de emisión</div>
                            <div class="fs-5 fw-bold"><span id="body_lblTiempoTotalEmision">0 min</span></div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="p-3 bg-body-tertiary rounded border">
                            <div class="text-muted small">Promedio de emisión por trámite</div>
                            <div class="fs-5 fw-bold"><span id="body_lblPromedioTiempoEmision">0 min</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE LA VISTA MENOR (INICIA OCULTA CON hidden) -->
        <section id="solicitud" hidden class="card shadow-sm border-primary">
            <div class="card-body">
                <h5 class="card-title mb-3">Procesar Solicitud de Carnet</h5>

                <div class="mb-3">
                    <label for="solicitud_inCedula" class="form-label">Cédula</label>
                    <input
                        type="text"
                        id="solicitud_inCedula"
                        class="form-control"
                        placeholder="Ej: 28123456"
                    />
                </div>

                <div class="mb-3">
                    <label for="solicitud_inNombre" class="form-label">Nombre</label>
                    <input
                        type="text"
                        id="solicitud_inNombre"
                        class="form-control"
                        placeholder="Nombre completo"
                    />
                </div>

                <div class="mb-3">
                    <label for="solicitud_selTipo" class="form-label">Tipo de trámite</label>
                    <select id="solicitud_selTipo" class="form-select">
                        <option value="Nuevo">Nuevo</option>
                        <option value="Reposicion">Reposición</option>
                    </select>
                </div>

                <div id="solicitud_divExtravio" hidden class="mb-3">
                    <label for="solicitud_inCantExtravioPrevio" class="form-label">Extravíos previos</label>
                    <input
                        type="number"
                        id="solicitud_inCantExtravioPrevio"
                        class="form-control"
                        min="0"
                        value="0"
                    />
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button id="solicitud_btCancelar" type="button" class="btn btn-outline-secondary">
                        Cancelar
                    </button>
                    <button id="solicitud_btAceptar" type="button" class="btn btn-success">
                        Aceptar
                    </button>
                </div>
            </div>
        </section>
    </div>

    <!-- SCRIPT MODULAR DE ARRANQUE E INYECCIÓN DE DEPENDENCIAS -->
    <script type="module">
        import cCarnetizacion from "./dist/controllers/cCarnetizacion.js";
        import cSolicitud from "./dist/controllers/cSolicitud.js";
        import vCarnetizacionBootstrap from "./dist/views/vCarnetizacionBootstrap.js";
        import vSolicitudBootstrap from "./dist/views/vSolicitudBootstrap.js";

        // 1. Instanciación de las Vistas concretas
        const vistaMayor = new vCarnetizacionBootstrap();
        const vistaMenor = new vSolicitudBootstrap();

        // 2. Inyección en los Controladores
        const controladorMenor = new cSolicitud(vistaMenor);
        new cCarnetizacion(vistaMayor, controladorMenor);
    </script>
</body>
</html>
